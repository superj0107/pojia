name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          for f in lib/*.js lib/channels/*.js bin/*.mjs test/*.mjs; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Unit tests
        run: npm test

      - name: Installer script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n test/install-sh-smoke.sh
          for f in *.command; do bash -n "$f"; done

      - name: install.sh smoke test
        run: bash test/install-sh-smoke.sh
